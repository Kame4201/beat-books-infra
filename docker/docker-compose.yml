services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: beatthebooks
      POSTGRES_USER: btb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btb -d beatthebooks"]
      interval: 5s
      timeout: 3s
      retries: 5

  data-service:
    build: ../../beat-books-data
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://btb:${DB_PASSWORD}@postgres:5432/beatthebooks
      SCRAPE_BACKEND: scrapling
      SCRAPE_DELAY_SECONDS: 5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  model-service:
    build: ../../beat-books-model
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://btb:${DB_PASSWORD}@postgres:5432/beatthebooks
      MODEL_ARTIFACTS_PATH: /app/model_artifacts
      MODEL_ID: ${MODEL_ID:-}
    volumes:
      - ../../beat-books-model/model_artifacts:/app/model_artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../../beat-books-api
    ports:
      - "8000:8000"
    environment:
      DATA_SERVICE_URL: http://data-service:8001
      MODEL_SERVICE_URL: http://model-service:8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      data-service:
        condition: service_healthy
      model-service:
        condition: service_healthy

volumes:
  pgdata:
